name: Feature Request
description: Suggest a new feature to improve the project.
title: "[✨ Feature]: "
labels: ["enhancement", "triage"]
# projects: [""]
assignees:
  - idkLilou
# type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
        Please fill out the form below with as much detail as possible.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we contact you if we need more information?
      placeholder: email@example.com
    validations:
      required: false

  - type: input
    id: feature-name
    attributes:
      label: Feature name
      description: Give your feature a short and descriptive name.
      placeholder: Dark Mode
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: Describe the feature you would like to see added.
      placeholder: Explain what the feature should do...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why would this feature be useful? What problem does it solve?
      placeholder: Explain how this feature would be used...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation (optional)
      description: If you have an idea of how this feature could be implemented, describe it here.
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any extra information, references, screenshots, or mockups.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../../CONTRIBUTING.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true