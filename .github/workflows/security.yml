###############
# Workflow metadata
###############
name: 🛡️ Security Analysis


###############
# Displayed name of the workflow run in the GitHub Actions interface.
# Includes the user who triggered the workflow and the analyzed branch.
###############
run-name: 🛡️ [${{ github.triggering_actor }}] Analysis of commit(s) on branch ${{ github.ref_name }}


###############
# Workflow triggers
#
# This workflow runs only on branches containing Python source code.
#
# - Pull requests targeting `dev` or `main` trigger a static analysis 
#   before integration.
# - Pushes to `dev` validate changes after feature or bug-fix merges.
# - Pushes to `main` validate the production branch after integration.
#
# Branches such as `ci-cd`, `environment`, and `doc` are intentionally
# excluded because they do not contain Python code to analyze.
###############
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

###############
# Executes automatically every Monday at 06:00 AM
###############
  schedule:
    # 0 → minute (0 - 59)
    # 6 → hour (0 - 23)
    # * → day of month (1 - 31) 
    # * → month (1 - 12) OR jan,feb,mar,apr ...
    # 1 → day of week (0 - 6) (Sunday=0 or 7) OR sun,mon,tue,wed,thu,fri,sat
    - cron: "0 6 * * mon" 

###############
# Enables manual workflow execution
###############
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-24.04

    ###############
    # Maximum execution time for the job.
    # Automatically cancels the job if it exceeds 5 minutes.
    ###############
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - run: echo "Starting Python dependencies security audit..."


      ###############
      # Audit Python dependencies for known vulnerabilities.
      # requirements.txt = application dependencies
      # requirements-dev.txt = development and CI dependencies
      ###############
      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt

